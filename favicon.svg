<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#24201c"/>
      <stop offset="100%" stop-color="#0e0d0c"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1d24"/>
      <stop offset="100%" stop-color="#1f0a0e"/>
    </linearGradient>

    <linearGradient id="cardFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EA"/>
      <stop offset="100%" stop-color="#E8DCB8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Subtle Vintage Inner Corner Stars -->
  <g fill="#F5D061" opacity="0.35" font-size="14" font-family="serif">
    <text x="36" y="52" text-anchor="middle">❖</text>
    <text x="476" y="52" text-anchor="middle">❖</text>
    <text x="36" y="478" text-anchor="middle">❖</text>
    <text x="476" y="478" text-anchor="middle">❖</text>
  </g>

  <!-- ================= CARDS GROUP ================= -->
  <g transform="translate(256, 262)">

    <!-- CARD 1 (Back card - Burgundy Velvet, tilted left -14deg) -->
    <g transform="rotate(-14) translate(-95, -135)" filter="url(#cardShadow)">
      <rect width="190" height="270" rx="18" fill="url(#cardBackGrad)" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75"/>
      <!-- Inner card frame -->
      <rect x="12" y="12" width="166" height="246" rx="12" fill="none" stroke="#F5D061" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,3"/>
      <!-- Diamond pattern inside back card -->
      <path d="M95,70 L135,135 L95,200 L55,135 Z" fill="none" stroke="#F5D061" stroke-width="2" stroke-opacity="0.25"/>
    </g>

    <!-- CARD 2 (Front card - Cream Editorial Face, tilted right +10deg) -->
    <g transform="rotate(10) translate(-95, -135)" filter="url(#cardShadow)">
      <rect width="190" height="270" rx="18" fill="url(#cardFrontGrad)" stroke="#2C1D11" stroke-width="4"/>
      
      <!-- Ornate Border on Cream Card -->
      <rect x="10" y="10" width="170" height="250" rx="12" fill="none" stroke="#8C2B32" stroke-width="2" stroke-opacity="0.8"/>
      <rect x="15" y="15" width="160" height="240" rx="8" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>

      <!-- Corner Suits / Symbols -->
      <g fill="#8C2B32" font-family="'Georgia', serif" font-weight="bold">
        <!-- Top Left -->
        <text x="24" y="38" font-size="16" text-anchor="middle">T</text>
        <path d="M24,44 C24,44 19,40 19,47 C19,51 24,54 24,54 C24,54 29,51 29,47 C29,40 24,44 24,44 Z" fill="#8C2B32"/>
        
        <!-- Bottom Right (upside down) -->
        <g transform="rotate(180 166 232)">
          <text x="166" y="222" font-size="16" text-anchor="middle">S</text>
          <path d="M166,228 C166,228 161,224 161,231 C161,235 166,238 166,238 C166,238 171,235 171,231 C171,224 166,228 166,228 Z" fill="#8C2B32"/>
        </g>
      </g>

      <!-- Center Emblem: Two Intertwined Hearts & Conversation Spark -->
      <g transform="translate(95, 135)">
        <!-- Subtle background glow -->
        <circle r="44" fill="#8C2B32" fill-opacity="0.08"/>
        
        <!-- Main Heart Symbol -->
        <path d="M0,28 C-32,2 -48,-18 -48,-36 C-48,-54 -32,-66 -14,-66 C-2,-66 0,-56 0,-56 C0,-56 2,-66 14,-66 C32,-66 48,-54 48,-36 C48,-18 32,2 0,28 Z"
              fill="url(#accentGrad)"
              transform="scale(0.85) translate(0, 15)"/>
        
        <!-- Conversation Flame / Spark in Center -->
        <path d="M0,-24 C6,-12 14,-4 14,8 C14,16 8,22 0,22 C-8,22 -14,16 -14,8 C-14,-4 -6,-12 0,-24 Z"
              fill="url(#goldGrad)"
              transform="scale(0.75) translate(0, -6)"/>

        <circle cx="0" cy="-2" r="3" fill="#FFF8E7"/>

        <!-- Decorative Star Sparkle Top -->
        <path d="M0,-52 L3,-42 L13,-39 L3,-36 L0,-26 L-3,-36 L-13,-39 L-3,-42 Z" fill="#F5D061"/>
      </g>

      <!-- Bottom Tagline / Accent line -->
      <line x1="45" y1="230" x2="145" y2="230" stroke="#8C2B32" stroke-width="1.5" stroke-opacity="0.5"/>
      <polygon points="95,227 98,230 95,233 92,230" fill="#8C2B32"/>
    </g>
  </g>
</svg>
